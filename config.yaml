# meetrec configuration. Every key has a default in code — deleting a key
# falls back to the default. Secrets go in .env, not here.

detector:
  poll_interval_s: 2
  start_debounce_s: 15
  stop_debounce_s: 30
  ignore_apps:
    - SoundRecorder.exe
    - Microsoft.WindowsSoundRecorder_8wekyb3d8bbwe
    - Microsoft.XboxGamingOverlay_8wekyb3d8bbwe

audio:
  min_session_s: 60          # sessions shorter than this are discarded

transcription:
  model: large-v3-turbo
  device: auto               # auto | cuda | cpu
  compute_type: auto         # auto -> float16 on CUDA, int8 on CPU

diarization:
  similarity_threshold: 0.75 # cosine threshold to recognize a known voice
  self_label: ME             # label for your own (mic-track) speech blocks,
                             # e.g. EU for Portuguese transcripts

summary:
  backend: gemini            # gemini | ollama | anthropic (others are fallbacks)
  language: auto             # auto = detected in the meeting | pt | en
                             # controls the language of the summary (file and
                             # Telegram message alike)
  gemini_model: gemini-2.0-flash
  ollama_model: gemma4:26b  # MoE, 4B active params: near-small-model CPU speed
                            # with much better quality; needs ~20 GB free RAM.
                            # On 16 GB machines use gemma3:4b instead.
  ollama_url: http://localhost:11434
  anthropic_model: claude-sonnet-5

output:
  dir: ~/Meetings
  keep_wav: false            # raw track WAVs are deleted once audio.flac and
                             # the transcripts exist (saves ~120 MB per hour)
  audio_retention_h: 0       # 0 = keep audio.flac forever; e.g. 72 = delete
                             # the audio 72h after processing, keeping the
                             # transcripts and summary. The daemon sweeps
                             # every 30 min; run `meetrec cleanup` manually.
                             # Note: `meetrec label` needs the audio — name
                             # unknown speakers before it expires.

telegram:
  enabled: true
  send_full_transcript: false  # the transcript only leaves the machine if true

debug:
  level: info                  # info | debug (or run any command with --debug)
  strict: false                # true: pipeline errors raise instead of being
                               # recorded in debug.json and skipped

notifications:                 # "recording started" is always on, by design
  recording_stopped: true
  processing_done: true
  speakers_unlabeled: true
  errors: true
